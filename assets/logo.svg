  <path d="M 50 85 C 22 70 20 45 50 21 C 80 45 78 70 50 85 Z" fill="url(#logo-grad)" fill-opacity="0.15" />
  
  <!-- Leaf Veins Left -->
  <line x1="50" y1="36" x2="31" y2="52" />
  <line x1="50" y1="49" x2="33" y2="65" />
  
  <!-- Leaf Veins Right -->
